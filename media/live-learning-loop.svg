<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">fluffy-guide live learning assistant loop</title>
  <desc id="desc">A diagram showing the fluffy-guide pipeline from audio or demo transcript input to rolling memory, summaries, guidance, and session logs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="76" y="88" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">fluffy-guide</text>
  <text x="76" y="126" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18">Live learning assistant: listen, summarize, guide, remember</text>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(100 220)">
      <rect width="200" height="150" rx="28" fill="#ffffff" stroke="#bae6fd"/>
      <text x="28" y="48" fill="#0f172a" font-size="22" font-weight="800">Input</text>
      <text x="28" y="82" fill="#475569" font-size="15">microphone stream</text>
      <text x="28" y="108" fill="#475569" font-size="15">demo transcript</text>
    </g>
    <g transform="translate(370 220)">
      <rect width="200" height="150" rx="28" fill="#ffffff" stroke="#bae6fd"/>
      <text x="28" y="48" fill="#0f172a" font-size="22" font-weight="800">Listener</text>
      <text x="28" y="82" fill="#475569" font-size="15">chunk speech</text>
      <text x="28" y="108" fill="#475569" font-size="15">emit events</text>
    </g>
    <g transform="translate(640 220)">
      <rect width="200" height="150" rx="28" fill="#ffffff" stroke="#bae6fd"/>
      <text x="28" y="48" fill="#0f172a" font-size="22" font-weight="800">Memory</text>
      <text x="28" y="82" fill="#475569" font-size="15">rolling context</text>
      <text x="28" y="108" fill="#475569" font-size="15">summary refresh</text>
    </g>
    <g transform="translate(910 220)">
      <rect width="200" height="150" rx="28" fill="url(#accent)"/>
      <text x="28" y="48" fill="#ffffff" font-size="22" font-weight="800">Guide</text>
      <text x="28" y="82" fill="#eef2ff" font-size="15">questions</text>
      <text x="28" y="108" fill="#eef2ff" font-size="15">next actions</text>
    </g>
  </g>

  <g stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" opacity="0.78">
    <line x1="304" y1="295" x2="360" y2="295"/>
    <line x1="574" y1="295" x2="630" y2="295"/>
    <line x1="844" y1="295" x2="900" y2="295"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="230" y="475" width="740" height="92" rx="28" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="270" y="513" fill="#0f172a" font-size="22" font-weight="800">Design point</text>
    <text x="270" y="546" fill="#475569" font-size="17">The app separates live capture, stateful memory, model calls, and JSONL logs so classroom assistance can be inspected and replayed.</text>
  </g>
</svg>
